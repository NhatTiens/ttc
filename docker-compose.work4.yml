services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tuong_tac_pro
    ports:
      - "5432:5432"
    volumes:
      - tuong_tac_pro_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tuong_tac_pro"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  tuong_tac_pro_pgdata:
